# FILE: purs/example/spago.yaml
# Workspace B: user code, compiled through the Zig backend.
#
# `workspace.backend.cmd` is the whole integration point. Spago runs
# `purs compile --codegen corefn` and then execs this command from THIS
# directory. Pointing it at node + the compiler bundle avoids needing a
# `purs-backend-zig` executable on PATH, so there is no npm link step.
#
# The `extraPackages` block overrides registry packages with local copies. A
# registry package ships JavaScript FFI and cannot have files added to it, so
# any package declaring a `foreign import` needs a vendored copy carrying Zig
# beside its sources. This is the override purerl achieves with a forked
# package set -- same mechanism, a handful of packages instead of a whole set.
#
# A registry package with NO foreign imports needs no such treatment: nothing
# references its `.js`, so it compiles through the backend untouched. That is
# why `either`, `maybe`, `invariant`, `newtype` and `safe-coerce` are absent
# from this list despite being dependencies of `exceptions` -- they come
# straight from the registry.
#
# `control` and `unsafe-coerce` are here for one foreign import each, reached
# transitively through `maybe`.
#
# `functions` is not in `dependencies` because nothing here imports
# `Data.Function.Uncurried` directly -- it is an `extraPackages` override only,
# so that `numbers` resolves its `Fn4` against the vendored copy rather than the
# registry one.
#
# `partial` is an override only: nothing here imports it directly, but
# `unfoldable` and `st` both depend on it and must resolve it to the vendored
# copy rather than the registry one, whose FFI is JavaScript.
#
# `numbers` is here because `integers` depends on it: `Data.Int.floor`,
# `ceil`, `round` and `trunc` are all `Data.Number` calls wrapped in a range
# clamp, so there is no way to take the one without the other.
package:
  name: example
  dependencies:
    - arrays: "*"
    - console: "*"
    - control: "*"
    - effect: "*"
    - enums: "*"
    - exceptions: "*"
    - foldable-traversable: "*"
    - integers: "*"
    - maybe: ">=6.0.0 <7.0.0"
    - numbers: "*"
    - prelude: "*"
    - refs: "*"
    - st: "*"
    - strings: "*"
    - tuples: ">=7.0.0 <8.0.0"
    - unfoldable: "*"
workspace:
  extraPackages:
    prelude:
      path: ../lib/purescript-prelude
    effect:
      path: ../lib/purescript-effect
    console:
      path: ../lib/purescript-console
    refs:
      path: ../lib/purescript-refs
    exceptions:
      path: ../lib/purescript-exceptions
    control:
      path: ../lib/purescript-control
    unsafe-coerce:
      path: ../lib/purescript-unsafe-coerce
    integers:
      path: ../lib/purescript-integers
    numbers:
      path: ../lib/purescript-numbers
    functions:
      path: ../lib/purescript-functions
    strings:
      path: ../lib/purescript-strings
    partial:
      path: ../lib/purescript-partial
    unfoldable:
      path: ../lib/purescript-unfoldable
    foldable-traversable:
      path: ../lib/purescript-foldable-traversable
    st:
      path: ../lib/purescript-st
    arrays:
      path: ../lib/purescript-arrays
    enums:
      path: ../lib/purescript-enums
  backend:
    cmd: node
    args:
      - ../compiler/bundle.js
