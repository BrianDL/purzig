# Workspace A: the backend compiler itself.
#
# This one uses the DEFAULT JavaScript backend -- it is a Node program. It must
# be a separate workspace from purs/example because `workspace.backend` is a
# per-workspace setting and the two need different backends.
#
# No `packageSet` here: with none pinned, spago uses the registry solver and
# picks compatible versions from the dependency list itself.
#
# `backend-optimizer` is NOT a registry package -- it is only ever consumed as a
# git dependency, which is what backend-erl does too. Its own dependency list is
# transcribed verbatim from its `spago.yaml` at the pinned tag; the solver needs
# it spelled out because there is no registry metadata to read it from. Every
# entry in that list IS a registry package, so this is the only `extra_packages`
# block needed -- backend-erl carries three more only because it wants a fork
# and specific refs of `dodo-printer` and `language-cst-parser`.

package:
  name: purs-backend-zig
  dependencies:
    - argonaut-codecs: ">=9.1.0 <10.0.0"
    - argonaut-core: ">=7.0.0 <8.0.0"
    - arrays: ">=7.3.0 <8.0.0"
    - backend-optimizer: "*"
    - console: ">=6.1.0 <7.0.0"
    - effect: ">=4.0.0 <5.0.0"
    - either: ">=6.1.0 <7.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - lists: ">=7.0.0 <8.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - newtype: ">=5.0.0 <6.0.0"
    - node-buffer: ">=9.0.0 <10.0.0"
    - node-fs: ">=9.2.0 <10.0.0"
    - node-path: ">=5.0.1 <6.0.0"
    - ordered-collections: ">=3.2.0 <4.0.0"
    - prelude: ">=6.0.2 <7.0.0"
    - strings: ">=6.0.1 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
  bundle:
    module: Main
    outfile: bundle.js
    platform: node
    type: app

workspace:
  extraPackages:
    backend-optimizer:
      git: https://github.com/aristanetworks/purescript-backend-optimizer
      ref: purs-backend-es-v1.4.2
      dependencies:
        - argonaut
        - arrays
        - control
        - debug
        - dodo-printer
        - either
        - enums
        - foldable-traversable
        - foreign-object
        - integers
        - language-cst-parser
        - lazy
        - lists
        - maybe
        - newtype
        - ordered-collections
        - partial
        - prelude
        - safe-coerce
        - st
        - strings
        - transformers
        - tuples
        - unsafe-coerce
