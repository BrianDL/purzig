# Vendored `purescript-strings` 6.0.1. See purescript-effect/spago.yaml for why
# these are vendored rather than resolved from the registry.
#
# Still a SUBSET of the package, but a smaller omission than before:
# `Data.String.CodePoints`, the `Data.String` umbrella and `Data.Char` are now
# present. What remains out:
#
#   * `Data.String.Regex` and its two satellites, which need a regular
#     expression engine. Nothing else in the closure imports them.
#   * `Data.String.NonEmpty.*`, `CaseInsensitive` and the two `Gen` modules,
#     which have no FFI of their own and pull in `nonempty` and `gen`. Cheap to
#     restore whenever something wants them.
#
# Note the code-unit semantics: a "code unit" in this backend is one Unicode
# code point, not one UTF-16 unit. See the header of `Data/String/CodeUnits.zig`
# for the reasoning, and `Data/String/CodePoints.zig` for why that choice makes
# this module's FFI almost entirely forwarders.
package:
  name: strings
  dependencies:
    - arrays
    - enums
    - integers
    - maybe
    - newtype
    - prelude
    - tuples
    - unfoldable
